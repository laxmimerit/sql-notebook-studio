# Publishes the 8 platform packages to three places:
#   - the VS Code Marketplace (VS Code),
#   - Open VSX (Cursor, Windsurf, VSCodium and other VS Code-based editors),
#   - a GitHub Release, for people who install from a file.
#
# Run it by pushing a version tag that matches package.json, for example:
#   git tag v1.0.1 && git push origin v1.0.1
# A tag push publishes everywhere. A manual run from the Actions tab (Run
# workflow) has a tick box per destination, for redoing one that failed; it
# uses the version in package.json.
#
# Each GitHub Release also carries copies without the version in the name, so
# links like .../releases/latest/download/sql-notebook-studio-win32-x64.vsix
# always give the newest version.
#
# No token is stored anywhere: both the Marketplace and Open VSX trust this
# workflow through Trusted Publishing (OpenID Connect). Their settings name
# this repository and this file, publish.yml. Renaming the file breaks it.

name: Publish to Marketplace

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      marketplace:
        description: VS Code Marketplace
        type: boolean
        default: true
      open_vsx:
        description: Open VSX (Cursor, Windsurf, VSCodium)
        type: boolean
        default: true
      github_release:
        description: GitHub Release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # Windows: package-all.py builds win32-x64 with vsce, then makes the
    # other 7 platform packages from it by swapping in their DuckDB engine.
    runs-on: windows-latest
    permissions:
      contents: write # creates the GitHub Release
      id-token: write # lets vsce get a short-lived Marketplace credential
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install
        run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      # The driver tests load the bundled drivers from dist/, so build first.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Build the 8 platform packages
        run: npm run package:all

      - name: Keep the packages
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vsix/*.vsix
          retention-days: 30

      - name: Publish to the VS Code Marketplace
        if: github.event_name == 'push' || inputs.marketplace
        shell: bash
        run: npx vsce publish --oidc --packagePath vsix/*.vsix

      - name: GitHub Release
        if: github.event_name == 'push' || inputs.github_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          tag="v$v"
          repo="$GITHUB_REPOSITORY"

          # Copies without the version, for the never-changing "latest" links.
          mkdir -p latest
          for f in vsix/*-"$v".vsix; do
            cp "$f" "latest/$(basename "$f" "-$v.vsix").vsix"
          done

          # Release notes: how to install, then this version's CHANGELOG section.
          {
            echo "## Install"
            echo
            echo "Easiest: search **SQL Notebook Studio** in VS Code's Extensions view."
            echo
            echo "From a file: download the package for your system, then in VS Code open **Extensions → ··· → Install from VSIX…**"
            echo
            echo "| System | Package |"
            echo "| --- | --- |"
            for p in "Windows (most PCs):win32-x64" "Windows on ARM:win32-arm64" \
                     "Mac with Apple Silicon (M1 and later):darwin-arm64" "Mac with Intel:darwin-x64" \
                     "Linux:linux-x64" "Linux on ARM:linux-arm64" \
                     "Alpine Linux:alpine-x64" "Alpine Linux on ARM:alpine-arm64"; do
              name="sql-notebook-studio-${p##*:}.vsix"
              echo "| ${p%:*} | [$name](https://github.com/$repo/releases/latest/download/$name) |"
            done
            echo
            echo "## What's in $v"
            awk -v h="## $v" '$0==h{on=1; next} on && /^## /{exit} on' CHANGELOG.md
          } > notes.md

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" vsix/*.vsix latest/*.vsix --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" vsix/*.vsix latest/*.vsix \
              --verify-tag --title "SQL Notebook Studio $v" --notes-file notes.md
          fi

      # Open VSX is the store Cursor, Windsurf, VSCodium and other VS Code-based
      # editors use. --skip-duplicate makes a rerun safe.
      - name: Publish to Open VSX
        if: github.event_name == 'push' || inputs.open_vsx
        shell: bash
        run: npx --yes ovsx@1.3.0 publish --trusted-publishing --skip-duplicate --packagePath vsix/*.vsix
